<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schulportal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--paper:#f9fbff;--line:#d9e3f7;--ink:#1c2370;--text:#1b1f3b;--mute:#6b7399;--card:#fff;--mark:#ffe36a;--red:#e5484d;--ok:#2f9e6b}
@media(prefers-color-scheme:dark){:root{--paper:#12152b;--line:#222a52;--ink:#9fb0ff;--text:#eef0ff;--mute:#8d96c4;--card:#1a1e3c;--mark:#6b5a10;--red:#ff7a7f;--ok:#58d19b}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;color:var(--text);background:var(--paper);
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px;
padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom));min-height:100vh}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:2rem;font-weight:800;margin:8px 0 2px;color:var(--ink)}
h2{font-size:1.05rem;margin:22px 0 8px;font-weight:800;color:var(--ink)}
.sub{color:var(--mute);margin:0 0 12px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:12px 14px;margin:8px 0;box-shadow:3px 3px 0 var(--ink)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.mark{background:var(--mark);padding:0 4px;border-radius:3px}
.tag{font-size:.8rem;color:var(--mute)}
.late{color:var(--red);font-weight:600}
.exam{border-color:var(--red);box-shadow:3px 3px 0 var(--red)}
.done{opacity:.45;text-decoration:line-through}
input,textarea,button,select{font:inherit;color:var(--text);background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:8px 10px}
input,textarea{width:100%}
textarea{min-height:150px;font-family:ui-monospace,monospace;font-size:.9rem}
button{background:var(--ink);color:var(--paper);font-weight:600;cursor:pointer}
button.ghost{background:var(--card);color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
form{display:grid;gap:8px;grid-template-columns:1fr 1fr}
form .full{grid-column:1/-1}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);border-top:2px solid var(--ink);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{background:none;color:var(--mute);border:0;font-size:.72rem;display:grid;gap:2px;justify-items:center;padding:4px 8px}
nav button span{font-size:1.3rem}
nav button.on{color:var(--ink);font-weight:800}
.err{color:var(--red);font-weight:600}
table{width:100%;border-collapse:collapse}
td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left;font-size:.9rem;vertical-align:top}
.scroll{overflow-x:auto}
@media(prefers-reduced-motion:no-preference){.card{transition:transform .12s}.card:active{transform:translate(2px,2px)}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS=['Mo','Di','Mi','Do','Fr'];
const TABS=[['heute','🏠','Heute'],['plan','📅','Plan'],['ha','📚','Aufgaben'],['vertretung','🔄','Vertretung'],['kal','🗓️','Kalender'],['set','⚙️','Mehr']];
let T=localStorage.getItem('t'),tab='heute',D=null,err='';
let S=JSON.parse(localStorage.getItem('S')||'null')||{updated:1,manual:[],due:{},done:[],remindTime:'17:00',tt:'',ntfy:'hw-'+Math.random().toString(36).slice(2,14),discord:''};

const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const today=()=>iso(new Date());
const days=d=>Math.round((new Date(d+'T00:00')-new Date(today()+'T00:00'))/864e5);
const rel=d=>{if(!d)return'kein Datum';const n=days(d);return n<0?`<span class="late">überfällig (${-n} Tg)</span>`:n==0?'<b>heute</b>':n==1?'<b>morgen</b>':`in ${n} Tagen`};
const fmt=d=>new Date(d).toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});

async function api(p,o={}){
  const r=await fetch('/api/'+p,{...o,headers:{'X-Token':T,'Content-Type':'application/json'}});
  if(r.status==401){localStorage.removeItem('t');location.reload()}
  if(!r.ok)throw new Error((await r.text()).slice(0,200));
  return r.json();
}
function save(){S.updated=Date.now();localStorage.setItem('S',JSON.stringify(S));api('state',{method:'PUT',body:JSON.stringify(S)}).catch(()=>{});render()}

function items(){
  const m=S.manual.map(h=>({id:h.id,title:h.title,subj:h.subject,due:h.due,manual:1}));
  const lim=Date.now()-30*864e5;
  const p=(D?.tasks||[]).filter(t=>!t.date||new Date(t.date)>lim).map(t=>({id:t.id,title:t.title,subj:t.subject_name,due:S.due[t.id]?.d||'',desc:t.description}));
  return [...m,...p].sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:1);
}
function ttDay(k){
  return S.tt.split('\n').map(l=>l.trim().match(/^(Mo|Di|Mi|Do|Fr)\s+(\d+)\s+(.+?)(?:\s+(\S+))?$/i)).filter(m=>m&&m[1].toLowerCase()==k.toLowerCase())
    .map(m=>({h:+m[2],fach:m[3],raum:m[4]||''})).sort((a,b)=>a.h-b.h);
}
const lessons=l=>l.length?l.map(x=>`<div class="card row"><span><span class="mark">${x.h}.</span> ${esc(x.fach)}</span><span class="tag">${esc(x.raum)}</span></div>`).join(''):'<p class="sub">Kein Plan hinterlegt (Mehr ▸ Stundenplan).</p>';
const hw=h=>`<div class="card"><div class="row"><label class="${S.done.includes(h.id)?'done':''}"><input type="checkbox" style="width:auto" ${S.done.includes(h.id)?'checked':''} data-done="${h.id}"> <b>${esc(h.title)}</b></label>
${h.manual?`<button class="ghost" data-del="${h.id}" aria-label="Löschen">✕</button>`:''}</div>
<div class="tag">${esc(h.subj)||'–'} · ${rel(h.due)}</div>
${!h.manual?`<div class="row" style="margin-top:6px"><span class="tag">Fällig am</span><input type="date" style="width:auto" value="${h.due}" data-due="${h.id}"></div>`:''}
${h.desc?`<div class="tag" style="margin-top:4px">${esc(h.desc).slice(0,200)}</div>`:''}</div>`;

const views={
heute(){
  const wd=(new Date().getDay()+6)%7,k=DAYS[wd>4?0:wd];
  const open=items().filter(h=>!S.done.includes(h.id)&&h.due).slice(0,4);
  const sub=D?.sub?.items||[];
  return `<h1>Heute</h1><p class="sub">${fmt(new Date())}${wd>4?' · Wochenende, Plan für Montag':''}</p>
  <h2>Stunden</h2>${lessons(ttDay(k))}
  <h2>Als Nächstes fällig</h2>${open.map(hw).join('')||'<p class="sub">Nichts mit Datum offen ✨</p>'}
  <h2>Vertretung</h2>${sub.length?`<p class="sub">${sub.length} Einträge im Plan – Details im Tab Vertretung.</p>`:'<p class="sub">Keine Einträge.</p>'}`;
},
plan(){return `<h1>Stundenplan</h1>`+DAYS.map(k=>`<h2>${k}</h2>${lessons(ttDay(k))}`).join('')},
ha(){
  return `<h1>Aufgaben</h1><p class="sub">Aus „Mein Unterricht“ plus eigene. Das Portal liefert kein Fälligkeitsdatum – trag es selbst ein, dann gibt's die Erinnerung.</p>
  <form id="add" class="card"><input class="full" name="title" placeholder="Neue Aufgabe" required><input name="subject" placeholder="Fach"><input name="due" type="date" required><button class="full">Aufgabe speichern</button></form>
  ${items().map(hw).join('')||'<p class="sub">Noch nichts da.</p>'}`;
},
vertretung(){
  const s=D?.sub;if(!s)return'<h1>Vertretung</h1><p class="sub">'+(D?'Nicht verfügbar.':'Lade…')+'</p>';
  return `<h1>Vertretung</h1><p class="sub">${s.date?fmt(s.date):''}</p>${s.info?`<div class="card">${esc(s.info)}</div>`:''}
  <div class="scroll"><table><tr><th>Std</th><th>Klasse</th><th>Fach</th><th>Lehrer</th><th>Vertr.</th><th>Raum</th><th>Info</th></tr>
  ${s.items.map(i=>`<tr>${['hours','class_name','subject','teacher','substitute','room','notice'].map(f=>`<td>${esc(i[f])}</td>`).join('')}</tr>`).join('')}</table></div>`;
},
kal(){
  const ev=(D?.cal||[]).filter(e=>days(iso(e.start))>=0).sort((a,b)=>a.start<b.start?-1:1);
  return `<h1>Kalender</h1><p class="sub">Nächste 90 Tage · 🚨 = Arbeit/Test</p>`+(ev.map(e=>{
    const x=/arbeit|klausur|test|lernkontrolle/i.test(e.title);
    return `<div class="card ${x?'exam':''}"><div class="row"><b>${x?'🚨 ':''}${esc(e.title)}</b><span class="tag">${rel(iso(e.start))}</span></div><div class="tag">${fmt(e.start)}${e.place?' · '+esc(e.place):''}</div></div>`}).join('')||'<p class="sub">Keine Termine.</p>');
},
set(){return `<h1>Mehr</h1>
  <h2>Erinnerung</h2><div class="card row"><span>Am Vortag um</span><input type="time" style="width:auto" id="rt" value="${S.remindTime}"></div>
  <p class="tag">Push aufs Handy: App „ntfy“ installieren und dieses Thema abonnieren (nicht weitergeben).</p><input id="nt" value="${esc(S.ntfy)}" placeholder="ntfy-Thema"><input id="dc" style="margin-top:8px" value="${esc(S.discord)}" placeholder="Discord-Webhook (optional)">
  <h2>Stundenplan</h2><p class="tag">Eine Stunde pro Zeile: <code>Tag Stunde Fach Raum</code></p>
  <textarea id="tt" placeholder="Mo 1 Mathe A12&#10;Mo 2 Deutsch B05&#10;Di 1 Englisch C01">${esc(S.tt)}</textarea>
  <div class="row" style="margin-top:10px"><button id="sv">Speichern</button><button class="ghost" id="rf">Portal neu laden</button><button class="ghost" id="lo">Abmelden</button></div>`}
};

function render(){
  $('#nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${k==tab?'on':''}" data-tab="${k}"><span>${i}</span>${l}</button>`).join('');
  const ER=Object.entries(D?.errors||{}).map(([k,v])=>`${k}: ${v}`).join(' · ');
  $('#app').innerHTML=(err?`<p class="err">⚠️ ${esc(err)}</p>`:'')+(ER?`<p class="err">⚠️ Nicht geladen – ${esc(ER)}</p>`:'')+views[tab]();
}
document.addEventListener('click',e=>{
  const sc=e.target.closest('[data-sid]');if(sc){$('#sid').value=sc.dataset.sid;$('#sq').value=sc.dataset.sname;$('#sres').innerHTML='';return}
  const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;return render()}
  const d=e.target.closest('[data-del]');if(d){S.manual=S.manual.filter(h=>h.id!=d.dataset.del);return save()}
  if(e.target.id=='sv'){S.remindTime=$('#rt').value||'17:00';S.tt=$('#tt').value;S.ntfy=$('#nt').value.trim();S.discord=$('#dc').value.trim();return save()}
  if(e.target.id=='rf')return load(true);
  if(e.target.id=='lo'){localStorage.clear();location.reload()}
});
document.addEventListener('change',e=>{
  const c=e.target.dataset;
  if(c.done){S.done=e.target.checked?[...S.done,c.done]:S.done.filter(x=>x!=c.done);save()}
  if(c.due){const t=(D?.tasks||[]).find(x=>x.id==c.due);S.due[c.due]={d:e.target.value,t:t?.title||'',s:t?.subject_name||''};save()}
});
document.addEventListener('submit',async e=>{
  e.preventDefault();
  const f=Object.fromEntries(new FormData(e.target));
  if(e.target.id=='login'){
    err='';
    if(!f.school&&/^\d+$/.test(f.sq))f.school=f.sq;
    if(!f.school){err='Bitte deine Schule aus der Liste wählen';return loginView()}
    try{
      const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(f)});
      if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(r.status==403?'Einladungscode falsch':(j.detail||'Anmeldung fehlgeschlagen'))}
      T=(await r.json()).token;localStorage.setItem('t',T);return init();
    }catch(x){err=x.message;return loginView()}
  }
  if(e.target.id=='add'){S.manual.push({id:'m'+Date.now(),...f});save()}
});
let st;
document.addEventListener('input',e=>{
  if(e.target.id!='sq')return;
  const q=e.target.value.trim();$('#sid').value=/^\d+$/.test(q)?q:'';
  clearTimeout(st);
  if(q.length<3||/^\d+$/.test(q)){$('#sres').innerHTML='';return}
  st=setTimeout(async()=>{try{
    const r=await(await fetch('/api/schools?q='+encodeURIComponent(q))).json();
    $('#sres').innerHTML=r.map(s=>`<button type="button" class="ghost" style="width:100%;text-align:left;margin-top:6px" data-sid="${esc(s.id)}" data-sname="${esc(s.name+', '+s.city)}">${esc(s.name)} <span class="tag">${esc(s.city)} · ${esc(s.id)}</span></button>`).join('')||'<p class="tag">Nichts gefunden.</p>';
  }catch(x){}},300);
});
function loginView(){
  $('#nav').innerHTML='';
  $('#app').innerHTML=`<h1>Schulportal</h1><p class="sub">Melde dich mit deinem Schulportal-Zugang an. Jeder sieht nur seine eigenen Daten.</p>${err?`<p class="err">⚠️ ${esc(err)}</p>`:''}
  <form id="login" class="card"><input class="full" name="sq" id="sq" placeholder="Schule suchen (Name, Ort oder Nummer)" autocomplete="off" required><input type="hidden" name="school" id="sid"><div id="sres" class="full"></div>
  <input class="full" name="username" placeholder="vorname.nachname" autocomplete="username" required>
  <input class="full" type="password" name="password" placeholder="Passwort" autocomplete="current-password" required>
  <input class="full" name="invite" placeholder="Einladungscode (falls nötig)"><button class="full">Anmelden</button></form>
  <p class="tag">Dein Passwort liegt verschlüsselt nur in deinem Browser und wird nur zum Abruf deiner Daten genutzt.</p>`;
}

async function load(refresh){
  err='';
  try{D=await api('data'+(refresh?'?refresh=true':''))}catch(x){err=x.message}
  render();
}
async function init(){
  if(!T)return loginView();
  render();
  try{const s=await api('state');if(s.updated>S.updated){S=s;localStorage.setItem('S',JSON.stringify(S))}else if(S.updated>s.updated)save()}catch(x){err=x.message}
  load();
}
init();
</script>
</body>
</html>
