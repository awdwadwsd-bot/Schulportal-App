/* Mein Unterricht */

.calendar-day-cell:hover{background:var(--accent-soft)}
.calendar-day-cell.outside{opacity:.38}
.calendar-day-cell.weekend{background:color-mix(in srgb,var(--paper) 44%,transparent)}

.calendar-span{align-self:center;z-index:1;min-width:0;height:22px;overflow:hidden;padding:3px 8px;border:0;border-left:3px solid #59c7b2;border-radius:6px;background:#59c7b228;color:var(--text);text-align:left;text-overflow:ellipsis;white-space:nowrap;font-size:.66rem;font-weight:700}
.calendar-span:hover{filter:brightness(1.1);transform:translateY(-1px)}
.calendar-span.work{border-left-color:#ff718d;background:#ff718d24;color:var(--red)}
.calendar-span.continues-left{border-top-left-radius:0;border-bottom-left-radius:0}
.calendar-span.continues-right{border-top-right-radius:0;border-bottom-right-radius:0}

.selected-agenda{margin-top:14px}
.selected-agenda .day-event-detail{padding:10px 0;border-top:1px solid var(--line)}
.day-event-title{font-weight:750;color:var(--ink)}
.day-event-time,.day-event-description{margin-top:4px;color:var(--mute);font-size:.82rem;line-height:1.45}
@media(max-width:700px){.calendar-grid-shell{padding:6px}.attendance-unavailable{display:block}.attendance-icon{margin-bottom:12px}.course-grid{grid-template-columns:1fr}}

const WRITTEN_CLASSWORK=new Set(['DEUTSCH','MATHEMATIK','ENGLISCH','SPANISCH','FRANZOESISCH','LATEIN','POLITIK UND WIRTSCHAFT']);

  const lim=Date.now()-30*864e5;
  const p=(D?.tasks||[]).filter(t=>(t.description||'').trim()&&(!t.date||new Date(t.date)>lim)).map(t=>({id:t.id,title:t.title,subj:t.subject_name,due:S.due[t.id]?.d||nextLessonDate(t.subject_name),assigned:datePart(t.date),desc:t.description}));
  return [...m,...p].sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:1);

function assignedLessonDate(h){
  if(!h.assigned)return '';
  if(h.assigned===today())return nextLessonDate(h.subj);
  const names={Montag:0,Dienstag:1,Mittwoch:2,Donnerstag:3,Freitag:4},wanted=subjectKey(h.subj),entries=(D?.timetable?.entries||[]).filter(e=>subjectKey(e.subject)===wanted);

function nextLessonDate(subject){const names={Montag:0,Dienstag:1,Mittwoch:2,Donnerstag:3,Freitag:4};const wanted=subjectKey(subject);let best=null;for(const e of D?.timetable?.entries||[]){if(subjectKey(e.subject)!==wanted)continue;const wd=names[e.day];if(wd===undefined)continue;const now=new Date(),delta=(wd-(now.getDay()+6)%7+7)%7,d=new Date(now);d.setHours(0,0,0,0);d.setDate(d.getDate()+delta);if(delta===0){const times=String(e.time||'').match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);if(times){const start=Number(times[1])*60+Number(times[2]),end=Number(times[3])*60+Number(times[4]),lessonEnd=end+(end-start)*(Math.max(1,Number(e.duration)||1)-1);if(now.getHours()*60+now.getMinutes()>=lessonEnd)d.setDate(d.getDate()+7)}}if(!best||d<best)best=d}return best?iso(best):''}
function groupLessons(list){const sorted=[...list].sort((a,b)=>Number.parseInt(a.h,10)-Number.parseInt(b.h,10)),out=[];for(const x of sorted){const start=Number.parseInt(x.h,10),duration=Math.max(1,Number.parseInt(x.duration,10)||1),p=out[out.length-1],same=p&&p.fach===x.fach&&p.raum===x.raum&&p.teacher===x.teacher&&start===p.endHour+1&&p.duration===1;if(same){p.endHour=start+duration-1;p.duration+=duration;p.double=p.duration>1;p.endTime=(x.time||'').split(' - ').pop()||p.endTime}else out.push({...x,startHour:start,endHour:start+duration-1,duration,double:duration>1})}return out}

 const output=[];
 for(const x of list){

function relevantWork(e){const title=String(e.title||''),description=String(e.description||''),text=(title+' '+description).toLocaleLowerCase('de-DE'),work=/arbeit|klassenarbeit|klausur|test|lernkontrolle|prüfung|pruefung|leistungsnachweis/i.test(text);if(!work)return false;const own=String(D?.profile?.class_name||D?.timetable?.class_name||'').replace(/\s/g,'').toLowerCase(),ownGrade=(own.match(/\d{1,2}/)||[])[0];const marked=[...text.matchAll(/\b(?:g|r|h)\s?\d{1,2}[a-z]?\b/gi)].map(m=>m[0].replace(/\s/g,'').toLowerCase());if(marked.length)return marked.includes(own);const section=[...text.matchAll(/\b(\d{1,2})\/\d+\b/g)].map(m=>m[1]);if(section.length&&section.some(g=>String(Number(g))!==String(Number(ownGrade))))return false;const subjects=[...new Set((D?.timetable?.entries||[]).map(x=>subjectName(x.subject).toLocaleLowerCase('de-DE')).filter(s=>s.length>=4))];return subjects.some(s=>text.includes(s))}

function exportCalendarIcs(events,name){const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MySchulportal+//Kalender//DE','CALSCALE:GREGORIAN','METHOD:PUBLISH'];for(const [n,e] of events.entries()){lines.push('BEGIN:VEVENT','UID:'+encodeURIComponent(String(e.title||'event'))+'-'+n+'@myschulportal-plus','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z'));const allDay=!!e.whole_day||/^\d{4}-\d\d-\d\d$/.test(String(e.start||''));lines.push((allDay?'DTSTART;VALUE=DATE:':'DTSTART:')+icsDate(e.start,allDay));if(e.end&&!allDay)lines.push('DTEND:'+icsDate(e.end));lines.push('SUMMARY:'+icsEscape(e.title),...(e.description?['DESCRIPTION:'+icsEscape(e.description)]:[]),...(e.place?['LOCATION:'+icsEscape(e.place)]:[]),'END:VEVENT')}lines.push('END:VCALENDAR');downloadText(name,lines.join('\r\n'),'text/calendar;charset=utf-8')}

function eventStartDate(e){const raw=String(e?.start||'');if(/^\d{4}-\d\d-\d\d$/.test(raw))return raw;const d=new Date(raw);return Number.isNaN(d.getTime())?'':iso(d)}
function eventEndDate(e){const raw=String(e?.end||''),start=eventStartDate(e);if(!raw)return start;let end=/^\d{4}-\d\d-\d\d$/.test(raw)?raw:(Number.isNaN(new Date(raw).getTime())?'':iso(new Date(raw)));if(!end)return start;if((e.whole_day||/T00:00(?::00)?(?:\.000)?(?:Z|[+-]\d\d:\d\d)?$/.test(raw))&&end>start){const d=new Date(end+'T12:00:00');d.setDate(d.getDate()-1);end=iso(d)}return end<start?start:end}
function calendarContains(e,date){const a=eventStartDate(e),b=eventEndDate(e);return !!a&&date>=a&&date<=(b||a)}
function dateDistance(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)}

e="label" placeholder="z. B. Vokabeltest (optional)"><button class="small-button">Eintragen</button></form>${(g.entries||[]).map((e,n)=>`<div class="row tag" style="margin-top:8px"><span>${esc(e.type)} · ${gradeGerman(Number(e.grade))}${e.label?' · '+esc(e.label):''}</span><button class="ghost small-button" data-grade-entry-del="${esc(key)}" data-grade-index="${n}" aria-label="Note löschen">✕</button></div>`).join('')}</section>`}).join('')||'<p class="sub">Füge dein erstes Fach hinzu.</p>')},
benutzer(){const p=D?.profile||{},field=(label,value)=>`<div class="profile-field"><small>${label}</small><b>${esc(value||'Nicht verfügbar')}</b></div>`;return `<h1>Benutzer</h1><p class="sub">Dein Schulportal-Konto und deine App-Einstellungen.</p><div class="profile-grid"><section class="card"><div class="row" style="justify-content:flex-start;margin-bottom:16px"><span class="mark" style="font-size:1.5rem;padding:12px">👤</span><div><b>Schüler / Student</b><div class="tag">Schulportal-Konto</div></div></div><div class="profile-fields">${field('Login',p.username)}${field('Schulnummer',p.school_id)}${field('Klasse',p.class_name)}${field('Angemeldet',D?'Ja':'Nein')}</div></section><aside><div class="card"><b>🛡️ Sicherheit</b><p class="row"><span class="tag">Token-Verschlüsselung</span><span class="status-good">Aktiv</span></p><p class="row"><span class="tag">Portal-Sitzung</span><span class="status-good">${D?'Aktiv':'Nicht verbunden'}</span></p></div><div class="card"><b>API-Status</b><p class="row"><span class="tag">Verbindung</span><span class="status-good">${D?'Verbunden':'Getrennt'}</span></p><p class="row"><span class="tag">Letzter Abruf</span><span class="tag">${D?.fetched?new Date(D.fetched).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'–'}</span></p></div></aside></div>
  <section class="card"><h2 style="margin-top:0">App installieren & Daten sichern</h2><p class="sub install-hint">Installiere die Website als App oder exportiere deine Aufgaben, Noten und Einstellungen für ein Backup.</p><div class="data-actions"><button type="button" class="ghost" data-pwa-install>📲 App installieren</button><button type="button" class="ghost" data-user-export>⬇ Daten exportieren</button><button type="button" class="ghost" data-user-import>⬆ Backup importieren</button><input type="file" id="user-backup-file" accept="application/json,.json" hidden></div></section>
  <h2>Startseite</h2><p class="tag">Wähle auf der Startseite „Startseite anpassen“, um Kacheln ein- oder auszublenden.</p>
  <h2>Erinnerung</h2><div class="card row"><span>Am Vortag um</span><input type="time" style="width:auto" id="rt" value="${S.remindTime}"></div>
  <p class="tag">Push aufs Handy: App „ntfy“ installieren und dieses Thema abonnieren (nicht weitergeben).</p><input id="nt" value="${esc(S.ntfy)}" placeholder="ntfy-Thema"><input id="dc" style="margin-top:8px" value="${esc(S.discord)}" placeholder="Discord-Webhook (optional)">
  <section class="card"><h2 style="margin-top:0">Datenschutz</h2><p class="sub">Die Bestätigung wird mit Datum und Versionsnummer gespeichert.</p><a href="/datenschutz" target="_blank" rel="noopener">Datenschutzerklärung lesen ↗</a></section>
  <h2>Stundenplan</h2><p class="tag">${(D?.timetable?.entries||[]).length?'Der Plan wird automatisch aus dem Schulportal geladen. Der eigene Text dient nur als Ersatz.':'Noch kein automatischer Portalplan verfügbar. Hier kannst du einen Ersatzplan eintragen.'} Format: <code>Mo 1 Mathe A12</code></p>
  <textarea id="tt" placeholder="Mo 1 Mathe A12&#10;Mo 2 Deutsch B05&#10;Di 1 Englisch C01">${esc(S.tt)}</textarea>
  <div class="row" style="margin-top:10px"><button id="sv">Einstellungen speichern</button><button class="ghost" id="rf">Portal neu laden</button><button class="ghost" id="lo">Abmelden</button></div>`}
};

function feedbackWidget(){if(!T)return '';return `<button class="feedback-fab" type="button" data-feedback-open>✦ Feedback</button><section class="feedback-panel ${feedbackOpen?'open':''}" aria-label="Feedback und Bugreport"><div class="feedback-head"><div><b>Feedback senden</b><div class="tag">Hilf mit, MySchulportal+ besser zu machen.</div></div><button class="ghost small-button" data-feedback-close aria-label="Schließen">✕</button></div><form id="feedback-form" style="margin-top:12px"><select name="category" required><option value="bug">🐛 Fehler melden</option><option value="idee">✨ Idee vorschlagen</option><option value="sonstiges">💬 Sonstiges</option></select><textarea name="message" maxlength="3000" placeholder="Was ist passiert oder was würdest du dir wünschen?" required></textarea><p class="tag">Bitte keine Passwörter oder vertraulichen Schuldaten eintragen. Die Meldung wird zur Bearbeitung gespeichert.</p><button class="full">Meldung senden</button>${feedbackMessage?`<p class="feedback-success">${esc(feedbackMessage)}</p>`:''}</form>${isAdmin?`<div class="row" style="margin-top:14px"><b>Admin-Postfach</b><button class="ghost small-button" data-feedback-inbox>Laden ${feedbackItems.length?`· ${feedbackItems.length}`:''}</button></div><div class="feedback-inbox">${feedbackItems.map(r=>`<article class="feedback-report"><div class="row"><b>${esc(r.category)} · ${fmt(r.created)}</b><button class="ghost small-button" data-feedback-delete="${esc(r.id)}">Löschen</button></div><div class="tag">${esc(r.page||'')}</div><div>${esc(r.message)}</div></article>`).join('')||'<p class="tag">Postfach noch nicht geladen oder leer.</p>'}</div>`:''}</section>`;}

function showFullScreenLoader(title,description){
  document.body.classList.add('is-loading');$('#nav').innerHTML='';const root=$('#feedback-root');if(root)root.innerHTML='';
  $('#app').innerHTML=brand+`<section class="app-loading" role="status" aria-live="polite"><div class="loading-orbit"><img src="/icon.svg" alt=""><span class="loading-spinner"></span></div><div class="loading-kicker">MYSCHULPORTAL+</div><h1>${esc(title)}</h1><p class="sub">${esc(description)}</p><div class="loading-track"><span></span></div><div class="loading-steps"><span class="step-ready">✓ Verbindung</span><span class="step-active">◌ Stundenplan &amp; Daten</span><span>○ Ansicht vorbereiten</span></div><p class="tag">Das Schulportal braucht manchmal einen Moment. Bitte lass diese Seite offen.</p></section>`;
}
function render(){
  if(T&&(!D||D.refreshing)&&!err){showFullScreenLoader(D?.refreshing?'Stundenplan ist da':'Schulportal wird verbunden',D?.refreshing?'Aufgaben, Kalender und weitere Inhalte werden noch geladen.':'Wir melden dich an und laden deine aktuellen Schuldaten.');return}
  document.body.classList.remove('is-loading');
  $('#nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${k==tab?'on':''}" data-tab="${k}"><span>${i}</span>${l}</button>`).join('');
  const errors=Object.entries(D?.errors||{});const noSub=errors.some(([k,v])=>k==='Vertretung'&&String(v).includes('response: -1'));const ER=errors.filter(([k])=>!(noSub&&k==='Vertretung')).map(([k,v])=>`${k}: ${v}`).join(' · ');
  $('#app').innerHTML=brand+`<div class="app-top"><button id="themeToggle" class="theme-toggle" aria-label="Darstellung wechseln">${theme==='dark'?'☀️ Hell':'🌙 Dunkel'}</button></div>`+(err?`<p class="err">⚠️ ${esc(err)}</p>`:'')+(noSub?'<div class="notice"><span class="notice-icon">ℹ️</span><div><b>Kein Vertretungsplan verfügbar</b><br>Deine Schule stellt über das Schulportal aktuell keine Vertretungsdaten bereit.</div></div>':'')+(ER?`<p class="err">⚠️ Nicht geladen – ${esc(ER)}</p>`:'')+views[tab]();
  const feedbackRoot=$('#feedback-root');if(feedbackRoot)feedbackRoot.innerHTML=feedbackWidget();
}
document.addEventListener('click',async e=>{
  if(e.target.closest('[data-feedback-open]')){feedbackOpen=true;feedbackMessage='';return render()}
  if(e.target.closest('[data-feedback-close]')){feedbackOpen=false;return render()}
  if(e.target.closest('[data-feedback-inbox]')){try{feedbackItems=await api('admin/feedback')}catch(x){err=x.message}return render()}
  const feedbackDelete=e.target.closest('[data-feedback-delete]');if(feedbackDelete){try{await api('admin/feedback/'+encodeURIComponent(feedbackDelete.dataset.feedbackDelete),{method:'DELETE'});feedbackItems=feedbackItems.filter(r=>r.id!==feedbackDelete.dataset.feedbackDelete)}catch(x){err=x.message}return render()}
  const sc=e.target.closest('[data-sid]');if(sc){$('#sid').value=sc.dataset.sid;$('#sq').value=sc.dataset.sname;$('#sres').innerHTML='';return}
  const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;return render()}
  const us=e.target.closest('[data-unterricht-section]');if(us){unterrichtSection=us.dataset.unterrichtSection;return render()}
  if(e.target.closest('[data-dashboard-edit]')){dashboardEdit=!dashboardEdit;return render()}
  if(e.target.closest('[data-user-export]')){const backup=backupData();downloadText('schulportal-backup-'+today()+'.json',JSON.stringify(backup,null,2),'application/json');return}
  if(e.target.closest('[data-user-import]')){$('#user-backup-file')?.click();return}
  if(e.target.closest('[data-privacy-accept]')){if(!$('#privacy-gate-check')?.checked){alert('Bitte bestätige zuerst die Datenschutzerklärung.');return}try{const r=await fetch('/api/privacy/accept',{method:'POST',headers:{'X-Token':T,'Content-Type':'application/json'},body:JSON.stringify({accepted:true})});if(!r.ok)throw new Error('Bestätigung konnte nicht gespeichert werden');return init()}catch(x){err=x.message;return privacyGateView()}}
  if(e.target.closest('[data-pwa-install]')){if(installPromptEvent){await installPromptEvent.prompt();await installPromptEvent.userChoice;installPromptEvent=null}else alert('Zum Installieren im Browser-Menü „App installieren“ oder „Zum Startbildschirm hinzufügen“ wählen.');return}
  const calNav=e.target.closest('[data-cal-nav]');if(calNav){calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+Number(calNav.dataset.calNav),1);calendarSelected=iso(calendarMonth);calendarDayOpen=false;return render()}
  if(e.target.closest('[data-cal-today]')){const n=new Date();calendarMonth=new Date(n.getFullYear(),n.getMonth(),1);calendarSelected=today();calendarDayOpen=false;return render()}
  const calDate=e.target.closest('[data-cal-date]');if(calDate){calendarSelected=calDate.dataset.calDate;calendarDayOpen=true;return render()}
  if(e.target.closest('[data-day-modal-open]')){calendarDayOpen=true;return render()}
  if(e.target.closest('[data-day-modal-close]')||e.target.matches('[data-day-modal-backdrop]')){calendarDayOpen=false;return render()}
  const calFilter=e.target.closest('[data-cal-filter]');if(calFilter){calendarFilter=calFilter.dataset.calFilter;return render()}
  const download=e.target.closest('[data-download]');if(download){if(download.dataset.download==='all-ics')exportCalendarIcs(D?.cal||[],'schulportal-termine.ics');if(download.dataset.download==='all-csv')downloadText('schulportal-termine.csv',exportCalendarCsv(D?.cal||[]),'text/csv;charset=utf-8');if(download.dataset.download==='work-ics')exportCalendarIcs((D?.cal||[]).filter(relevantWork),'meine-arbeiten.ics');return}
  if(e.target.id==='blog-cancel'){blogEditId=null;return render()}
  const blogEdit=e.target.closest('[data-blog-edit]');if(blogEdit){blogEditId=blogEdit.dataset.blogEdit;return render()}
  const blogDelete=e.target.closest('[data-blog-delete]');if(blogDelete){if(!confirm('Diesen Beitrag wirklich löschen?'))return;try{await api('admin/blog/'+encodeURIComponent(blogDelete.dataset.blogDelete),{method:'DELETE'});blogPosts=await api('admin/blog');render()}catch(x){err=x.message;render()}return}
  if(e.target.closest('[data-blog-backup]')){downloadText('blogbeitraege.json',JSON.stringify(blogPosts,null,2),'application/json');return}
  const d=e.target.closest('[data-del]');if(d){S.manual=S.manual.filter(h=>h.id!=d.dataset.del);return save()}
  if(e.target.id=='sv'){S.remindTime=$('#rt').value||'17:00';S.tt=$('#tt').value;S.ntfy=$('#nt').value.trim();S.discord=$('#dc').value.trim();return save()}
  if(e.target.id==='themeToggle'){theme=theme==='dark'?'light':'dark';localStorage.setItem('theme',theme);document.documentElement.dataset.theme=theme;return render()}
  const gd=e.target.closest('[data-grade-del]');if(gd){delete S.grades[gd.dataset.gradeDel];return save()}
  const ge=e.target.closest('[data-grade-entry-del]');if(ge){S.grades[ge.dataset.gradeEntryDel].entries.splice(Number(ge.dataset.gradeIndex),1);return save()}
  if(e.target.id=='rf')return load(true);
  if(e.target.id=='lo'){localStorage.clear();location.reload()}
});

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&calendarDayOpen){calendarDayOpen=false;render()}});
document.addEventListener('change',async e=>{
  const c=e.target.dataset;
  if(c.widget){S.dashboard=dashboardWidgets();S.dashboard[c.widget]=e.target.checked;return save()}
  if(c.studyToggle){let key;try{key=decodeURIComponent(c.studyToggle)}catch{return}S.studyDone||=[];S.studyDone=e.target.checked?[...new Set([...S.studyDone,key])]:S.studyDone.filter(x=>x!==key);return save()}
  if(e.target.id==='work-search'){workSearch=e.target.value.trim();return render()}
  if(e.target.id==='cal-search'){calendarSearch=e.target.value.trim();return render()}
  if(e.target.id==='work-subject'){workSubject=e.target.value;return render()}
  if(e.target.id==='work-range'){workRange=e.target.value;return render()}
  if(e.target.id==='user-backup-file'&&e.target.files?.[0]){try{const parsed=JSON.parse(await e.target.files[0].text()),incoming=parsed.data||parsed;if(!incoming||typeof incoming!=='object'||Array.isArray(incoming))throw new Error('Ungültige Sicherungsdatei');if(!confirm('Backup importieren? Die aktuellen Aufgaben, Noten und Einstellungen werden ersetzt.'))return;const keep={ntfy:S.ntfy,discord:S.discord};S={...S,...incoming,...keep,updated:Date.now()};S.manual=Array.isArray(S.manual)?S.manual:[];S.due=S.due&&typeof S.due==='object'?S.due:{};S.done=Array.isArray(S.done)?S.done:[];S.grades=S.grades&&typeof S.grades==='object'?S.grades:{};S.studyDone=Array.isArray(S.studyDone)?S.studyDone:[];return save()}catch(x){alert('Backup konnte nicht importiert werden: '+x.message)}finally{e.target.value=''}return}
  if(e.target.id==='sub-date'&&e.target.value){subDate=e.target.value;subData=null;subLoading=true;subError='';render();api('substitution?date='+encodeURIComponent(subDate)).then(x=>{subData=x;subLoading=false;render()}).catch(x=>{subError=x.message;subLoading=false;render()});return}
  if(c.weight){const g=S.grades[c.weight];g[c.type==='written'?'writtenWeight':'oralWeight']=Number(e.target.value)||0;g.weightSource='custom';save();return}
  if(e.target.id==='new-due')e.target.dataset.edited='1';
  if(c.done){S.done=e.target.checked?[...S.done,c.done]:S.done.filter(x=>x!=c.done);save()}
  if(c.due){const t=(D?.tasks||[]).find(x=>x.id==c.due);S.due[c.due]={d:e.target.value,t:t?.title||'',s:t?.subject_name||''};save()}
});
document.addEventListener('submit',async e=>{
  e.preventDefault();
  const f=Object.fromEntries(new FormData(e.target));
  if(e.target.id==='feedback-form'){
    const button=e.target.querySelector('button[type=submit]');if(button){button.disabled=true;button.textContent='Wird gesendet …'}
    try{await api('feedback',{method:'POST',body:JSON.stringify({category:f.category,message:f.message,page:tab})});feedbackMessage='Danke! Deine Meldung ist angekommen.';feedbackItems=[];return render()}catch(x){feedbackMessage=x.message;return render()}
  }
  if(e.target.id==='grade-add'){const key=addGradeSubject(f.subject);return key?save():undefined}
  if(e.target.matches('[data-grade-form]')){const g=S.grades[e.target.dataset.gradeForm];g.entries.push({type:f.type,grade:Number(f.grade),label:f.label.trim()});return save()}
  if(e.target.id==='blog-form'){
    const payload={title:f.title,summary:f.summary||'',body:f.body,published:$('#blog-published').checked};
    try{await api(blogEditId?'admin/blog/'+encodeURIComponent(blogEditId):'admin/blog',{method:blogEditId?'PUT':'POST',body:JSON.stringify(payload)});blogEditId=null;blogPosts=await api('admin/blog');err='';render()}catch(x){err=x.message;render()}
    return;
  }
  if(e.target.id=='login'){
    err='';
    f.privacy_accepted=$('#privacy-accepted').checked;
    if(!f.school&&/^\d+$/.test(f.sq))f.school=f.sq;
    if(!f.school){err='Bitte deine Schule aus der Liste wählen';return loginView()}
    try{
      const submitButton=e.target.querySelector('button[type=submit]');if(submitButton){submitButton.disabled=true;submitButton.textContent='Stundenplan wird geladen …'}
      showFullScreenLoader('Schulportal wird verbunden','Deine Anmeldung wird geprüft und der Stundenplan vorbereitet.');
      const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(f)});
      if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(r.status==403?'Einladungscode falsch':(j.detail||'Anmeldung fehlgeschlagen'))}
      T=(await r.json()).token;localStorage.setItem('t',T);return init();
    }catch(x){err=x.message;return loginView()}
  }
  if(e.target.id=='add'){S.manual.push({id:'m'+Date.now(),assigned:today(),...f});save()}
});
let st;
document.addEventListener('input',e=>{
  if(e.target.id==='work-search'){workSearch=e.target.value;const pos=e.target.selectionStart;clearTimeout(st);st=setTimeout(()=>{if(tab==='arbeiten'){render();const input=$('#work-search');input?.focus();input?.setSelectionRange(pos,pos)}},180);return}
  if(e.target.id==='new-subject'){const due=$('#new-due');if(due&&!due.dataset.edited)due.value=nextLessonDate(e.target.value)||today();return}
  if(e.target.id!='sq')return;
  const q=e.target.value.trim();$('#sid').value=/^\d+$/.test(q)?q:'';
  clearTimeout(st);
  if(q.length<3||/^\d+$/.test(q)){$('#sres').innerHTML='';return}
  st=setTimeout(async()=>{try{
    const r=await(await fetch('/api/schools?q='+encodeURIComponent(q))).json();
    $('#sres').innerHTML=r.map(s=>`<button type="button" class="ghost" style="width:100%;text-align:left;margin-top:6px" data-sid="${esc(s.id)}" data-sname="${esc(s.name+', '+s.city)}">${esc(s.name)} <span class="tag">${esc(s.city)} · ${esc(s.id)}</span></button>`).join('')||'<p class="tag">Nichts gefunden.</p>';
  }catch(x){}},300);
});

}

  <form id="login" class="card"><input class="full" name="sq" id="sq" placeholder="Schule suchen (Name, Ort oder Nummer)" autocomplete="off" required><input type="hidden" name="school" id="sid"><div id="sres" class="full"></div>

  <p class="tag">Dein Passwort liegt verschlüsselt nur in deinem Browser und wird nur zum Abruf deiner Daten genutzt.</p><section class="card"><h2>Über Lukas</h2><div id="publicBlog"><p class="sub">Beiträge werden geladen …</p></div></section>`;

let loadTimer=null;
async function load(refresh,poll=0){
  err='';
  try{
    D=await api('data'+(refresh?'?refresh=true':''));
    if(D?.refreshing){render();clearTimeout(loadTimer);loadTimer=setTimeout(()=>load(false,poll+1),poll<20?1200:4000);return}
    let changed=false;for(const t of D?.tasks||[]){if(!(t.description||'').trim()||S.due[t.id]?.d)continue;const due=nextLessonDate(t.subject_name);if(due){S.due[t.id]={d:due,t:t.title,s:t.subject_name};changed=true}}
    if(changed)save();
    const status=await api('admin/status').catch(()=>({admin:false}));isAdmin=!!status.admin;
    blogPosts=await api(isAdmin?'admin/blog':'blog').catch(()=>[]);
  }catch(x){err=x.message}
  render();
}
async function init(){
  if(!T)return loginView();
  try{const r=await fetch('/api/privacy/status',{headers:{'X-Token':T}});if(r.status===401){localStorage.removeItem('t');T='';return loginView()}if(!r.ok)throw new Error('Datenschutzstatus konnte nicht geladen werden');const consent=await r.json();if(!consent.accepted)return privacyGateView()}catch(x){err=x.message;return loginView()}
  showFullScreenLoader('Dein Stundenplan wird vorbereitet','Deine Aufgaben und Termine werden mit deinem Portalzugang abgeglichen.');
  try{const s=await api('state');if(s.updated>S.updated){S=s;S.grades ||= {};localStorage.setItem('S',JSON.stringify(S))}else if(S.updated>s.updated)save()}catch(x){err=x.message}
  let migratedTasks=false;S.manual ||= [];for(const h of S.manual){if(!h.assigned){h.assigned=h.created||today();migratedTasks=true}}if(migratedTasks)save();
  if(migrateGradeWeights())save();
  load();
}
init();
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPromptEvent=e});
window.addEventListener('appinstalled',()=>{installPromptEvent=null});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
